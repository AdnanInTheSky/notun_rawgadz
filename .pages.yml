media:
  input: content/images
  output: /content/images
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: products
    label: Products
    type: collection
    path: content/product
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Product ID
        required: true

      - name: title
        type: string
        label: Title
        required: true

      # CHANGED: 'image' to 'string' so you can paste a URL
      - name: imageSrc
        type: string
        label: Main Image URL
        required: true
        description: "Paste the full image link (e.g., https://example.com/image.png)"

      - name: description
        type: string
        label: Description
        required: true

      - name: price
        type: number
        label: Price
        required: true

      - name: tags
        type: string
        label: Tags
        list: true
        description: "Outputs an array, not a comma-separated string"

      - name: types
        type: object
        label: Product Variants
        list: true
        fields:
          - name: subProductId
            type: string
            label: Variant ID
            required: true

          - name: subTitle
            type: string
            label: Variant Title
            required: true

          # CHANGED: 'image' to 'string'
          - name: subImage
            type: string
            label: Variant Image URL
            required: false
            description: "Paste the full image link"

      - name: body
        type: rich-text
        label: Body
        required: false

  - name: blog
    label: Blog Posts
    type: collection
    path: content/blog
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        label: Title
        required: true

      - name: date
        type: string
        label: Date
        required: true
        description: "Use YYYY-MM-DD format (e.g., 2026-08-08) so the build script sorts them correctly."

      - name: excerpt
        type: string
        label: Excerpt
        required: true
        description: "Short summary that will appear on the blog cards."

      - name: body
        type: rich-text
        label: Content
        required: true