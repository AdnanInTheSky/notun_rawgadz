media:
  input: content/images
  output: /content/images
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: products
    label: Products
    type: collection
    path: content/product
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Product ID
        required: true

      - name: slug
        type: string
        label: Slug / URL
        required: false
        description: "URL slug for standalone product page (e.g. minimalist-smart-watch)"

      - name: tab
        type: select
        label: Menu
        required: false
        default: normal
        options:
          - normal
          - gadget

      - name: title
        type: string
        label: Title
        required: true

      - name: imageSrc
        type: string
        label: Main Image URL
        required: true
        description: "Paste the full image link (e.g., https://example.com/image.png)"

      - name: description
        type: string
        label: Description
        required: true

      - name: price
        type: number
        label: Price
        required: true

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated tags (e.g., wearables, tech, fitness)"

      - name: types
        type: object
        label: Product Variants
        list: true
        fields:
          - name: subProductId
            type: string
            label: Variant ID
            required: true

          - name: subTitle
            type: string
            label: Variant Title
            required: true

          - name: subImage
            type: string
            label: Variant Image URL
            required: false
            description: "Paste the full image link"

          - name: price
            type: number
            label: Variant Price (Optional)
            required: false

          - name: subProducts
            type: object
            label: Sub-Variants / Options
            list: true
            fields:
              - name: subProductId
                type: string
                label: Sub-Variant ID
                required: true

              - name: subTitle
                type: string
                label: Sub-Variant Title
                required: true

              - name: subImage
                type: string
                label: Sub-Variant Image URL
                required: false
                description: "Paste the full image link"

              - name: price
                type: number
                label: Option Price (Optional)
                required: false

      - name: body
        type: rich-text
        label: Body
        required: false

  - name: blog
    label: Blog Posts
    type: collection
    path: content/blog
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Post ID
        required: true

      - name: title
        type: string
        label: Title
        required: true

      - name: date
        type: string
        label: Date
        required: true
        description: "Use YYYY-MM-DD format (e.g., 2026-08-08) so the build script sorts them correctly."

      - name: author
        type: string
        label: Author
        required: true

      - name: excerpt
        type: string
        label: Excerpt
        required: true
        description: "Short summary that will appear on the blog cards."

      - name: imageSrc
        type: string
        label: Main Image URL
        required: true
        description: "Paste the full image link (e.g., https://example.com/image.png)"

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated list of tags"

      - name: body
        type: rich-text
        label: Content
        required: true

  - name: cars
    label: Cars / Automotive
    type: collection
    path: content/cars
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Car ID
        required: true

      - name: title
        type: string
        label: Vehicle Title
        required: true

      - name: imageSrc
        type: string
        label: Main Vehicle Image URL
        required: true
        description: "Paste the full image link"

      - name: youtube
        type: string
        label: YouTube Video ID
        required: false
        description: "Paste the YouTube video ID (e.g., kU_tEwQ6Z_E)"

      - name: youtubeUrl
        type: string
        label: YouTube URL
        required: false
        description: "Paste the full YouTube video link"

      - name: description
        type: string
        label: Description / Summary
        required: true

      - name: price
        type: number
        label: Starting MSRP / Price
        required: true

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated tags (e.g., sports, track, v8)"

      - name: types
        type: object
        label: Vehicle Trims & Editions
        list: true
        fields:
          - name: subProductId
            type: string
            label: Trim ID
            required: true

          - name: subTitle
            type: string
            label: Trim / Edition Title
            required: true

          - name: subImage
            type: string
            label: Trim Image URL
            required: false

          - name: price
            type: number
            label: Trim Price (Optional)
            required: false

          - name: subProducts
            type: object
            label: Options & Packages
            list: true
            fields:
              - name: subProductId
                type: string
                label: Option ID
                required: true

              - name: subTitle
                type: string
                label: Package / Option Title
                required: true

              - name: subImage
                type: string
                label: Option Image URL
                required: false

              - name: price
                type: number
                label: Package Price (Optional)
                required: false

      - name: content
        type: rich-text
        label: Vehicle Specifications & Details
        required: false