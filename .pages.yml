media:
  input: content/images
  output: /content/images
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: products
    label: Products
    type: collection
    path: content/product
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Product ID
        required: true

      - name: slug
        type: string
        label: Slug / URL
        required: false
        description: "URL slug for standalone product page (e.g. minimalist-smart-watch)"

      - name: tab
        type: string
        label: Tab
        required: false
        default: normal
        description: "Enter the tab name, e.g. normal or gadget"

      - name: title
        type: string
        label: Title
        required: true

      - name: imageSrc
        type: string
        label: Main Image URL
        required: false
        description: "Paste the full image link (e.g., https://example.com/image.png)"

      - name: images
        type: string
        label: Product Images Gallery
        list: true
        required: false
        description: "List of image links for the product"

      - name: description
        type: string
        label: Description
        required: true

      - name: price
        type: number
        label: Price
        required: true

      - name: priceRange
        type: object
        label: Price Range
        required: false
        fields:
          - name: min
            type: number
            label: Minimum Price

          - name: max
            type: number
            label: Maximum Price

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated tags (e.g., wearables, tech, fitness)"

      - name: types
        type: object
        label: Product Variants
        list: true
        fields:
          - name: subProductId
            type: string
            label: Variant ID
            required: true

          - name: subTitle
            type: string
            label: Variant Title
            required: true

          - name: subImage
            type: string
            label: Variant Image URL
            required: false
            description: "Paste the full image link"

          - name: images
            type: string
            label: Variant Images
            list: true
            required: false
            description: "List of image links for this variant"

          - name: price
            type: number
            label: Variant Price (Optional)
            required: false

          - name: subProducts
            type: object
            label: Sub-Variants / Options
            list: true
            fields:
              - name: subProductId
                type: string
                label: Sub-Variant ID
                required: true

              - name: subTitle
                type: string
                label: Sub-Variant Title
                required: true

              - name: subImage
                type: string
                label: Sub-Variant Image URL
                required: false
                description: "Paste the full image link"

              - name: images
                type: string
                label: Option Images
                list: true
                required: false
                description: "List of image links for this option"

              - name: price
                type: number
                label: Option Price (Optional)
                required: false

      - name: body
        type: rich-text
        label: Body
        required: false

  - name: blog
    label: Blog Posts
    type: collection
    path: content/blog
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Post ID
        required: true

      - name: title
        type: string
        label: Title
        required: true

      - name: date
        type: string
        label: Date
        required: true
        description: "Use YYYY-MM-DD format (e.g., 2026-08-08) so the build script sorts them correctly."

      - name: author
        type: string
        label: Author
        required: true

      - name: excerpt
        type: string
        label: Excerpt
        required: true
        description: "Short summary that will appear on the blog cards."

      - name: imageSrc
        type: string
        label: Main Image URL
        required: true
        description: "Paste the full image link (e.g., https://example.com/image.png)"

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated list of tags"

      - name: body
        type: rich-text
        label: Content
        required: true

  - name: cars
    label: Cars / Automotive
    type: collection
    path: content/cars
    format: yaml-frontmatter
    fields:
      - name: id
        type: string
        label: Car ID
        required: true

      - name: title
        type: string
        label: Vehicle Title
        required: true

      - name: mediaType
        type: select
        label: Card Media Type
        required: false
        default: both
        options:
          - both
          - youtube
          - video
          - image
        description: "Choose media type to display on car card: both (interactive toggle), youtube, video, or image"

      - name: imageSrc
        type: string
        label: Main Vehicle Image URL
        required: false
        description: "Paste the full image link"

      - name: images
        type: string
        label: Vehicle Images Gallery
        list: true
        required: false
        description: "List of image links for the vehicle"

      - name: youtube
        type: string
        label: YouTube Video ID or URL
        required: false
        description: "Paste the YouTube video ID or full URL"

      - name: youtubeUrl
        type: string
        label: YouTube URL
        required: false
        description: "Paste the full YouTube video link"

      - name: video
        type: string
        label: Direct Video URL
        required: false
        description: "Direct video link (.mp4/.webm)"

      - name: videoUrl
        type: string
        label: Direct Video URL (Alternative)
        required: false
        description: "Direct video link (.mp4/.webm)"

      - name: description
        type: string
        label: Description / Summary
        required: true

      - name: price
        type: number
        label: Starting MSRP / Price
        required: true

      - name: tags
        type: string
        label: Tags
        required: false
        description: "Comma-separated tags (e.g., sports, track, v8)"

      - name: types
        type: object
        label: Vehicle Trims & Editions
        list: true
        fields:
          - name: subProductId
            type: string
            label: Trim ID
            required: true

          - name: subTitle
            type: string
            label: Trim / Edition Title
            required: true

          - name: subImage
            type: string
            label: Trim Image URL
            required: false

          - name: images
            type: string
            label: Variant Images Gallery
            list: true
            required: false
            description: "List of image links for this variant"

          - name: price
            type: number
            label: Trim Price (Optional)
            required: false

          - name: subProducts
            type: object
            label: Options & Packages
            list: true
            fields:
              - name: subProductId
                type: string
                label: Option ID
                required: true

              - name: subTitle
                type: string
                label: Package / Option Title
                required: true

              - name: subImage
                type: string
                label: Option Image URL
                required: false

              - name: images
                type: string
                label: Option Images Gallery
                list: true
                required: false
                description: "List of image links for this option"

              - name: price
                type: number
                label: Package Price (Optional)
                required: false

      - name: content
        type: rich-text
        label: Vehicle Specifications & Details
        required: false

  - name: hero
    label: Hero Slides
    type: collection
    path: content/hero
    format: yaml-frontmatter
    fields:
      - name: page
        type: select
        label: Target Page
        required: true
        options:
          - index
          - gadgets
          - car

      - name: order
        type: number
        label: Display Order
        required: false
        default: 1

      - name: type
        type: string
        label: Media Type
        required: true
        default: image
        description: "Enter the media type manually, e.g. image, video, youtube"

      - name: src
        type: string
        label: Media URL
        required: true
        description: "Image URL, direct video file (.mp4/.webm), or YouTube URL"

      - name: poster
        type: string
        label: Video Poster URL
        required: false
        description: "Fallback thumbnail image shown before video loads"

      - name: alt
        type: string
        label: Alt / Title Description
        required: false

  - name: index_categories
    label: Index Categories Carousel
    type: collection
    path: content/index
    format: yaml-frontmatter
    fields:
      - name: tag
        type: string
        label: Filter Tag
        required: true

      - name: label
        type: string
        label: Display Label
        required: true

      - name: image
        type: string
        label: Category Image URL
        required: true

      - name: order
        type: number
        label: Display Order
        required: false
        default: 1

  - name: gadgets_categories
    label: Gadgets Categories Carousel
    type: collection
    path: content/gadgets
    format: yaml-frontmatter
    fields:
      - name: tag
        type: string
        label: Filter Tag
        required: true

      - name: label
        type: string
        label: Display Label
        required: true

      - name: image
        type: string
        label: Category Image URL
        required: true

      - name: order
        type: number
        label: Display Order
        required: false
        default: 1