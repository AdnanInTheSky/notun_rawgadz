<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Rawgad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="./components/utilities/tailwind.js"></script>
  <script type="module" src="./components/navbar/my-navbar.js"></script>
  <script type="module" src="./components/cart/my-cart.js"></script>
  <script type="module" src="./components/checkout/my-checkout.js"></script>
  <script type="module" src="./components/footer/my-footer.js"></script>
  <script type="module" src="./components/form/my-form.js"></script>
</head>
<body class="bg-neutral-50 min-h-screen flex flex-col font-sans text-neutral-900 selection:bg-black selection:text-white">

  <my-navbar>
    <div class="flex gap-6 items-center flex-grow">
      <a href="./index.html" class="hover:text-black transition-colors font-semibold text-xs tracking-wider uppercase text-black font-bold border-b-2 border-black pb-0.5">Home</a>
      <a href="./index.html#shop" class="hover:text-black transition-colors font-semibold text-xs tracking-wider uppercase text-neutral-600">Shop</a>
      <a href="./car.html" class="hover:text-black transition-colors font-semibold text-xs tracking-wider uppercase text-neutral-600">Cars</a>
      <a href="./blog.html" class="hover:text-black transition-colors font-semibold text-xs tracking-wider uppercase text-neutral-600">Blog</a>
      <a href="./contact.html" class="hover:text-black transition-colors font-semibold text-xs tracking-wider uppercase text-neutral-600">Contact</a>
    </div>
    <my-cart storage-key="main_store_cart"></my-cart>
  </my-navbar>

  <main class="p-4 md:p-6 flex flex-col items-center mt-2 w-full max-w-7xl mx-auto flex-grow gap-6">
    <section class="w-full">
      <h1 class="text-2xl font-black text-black mb-4 border-b border-neutral-200 pb-2 tracking-tight">Finalize Order</h1>
      
      <my-checkout api-endpoint="/api/checkout" storage-key="main_store_cart" class="w-full">
        
        <!-- Payment Method Options -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="cursor-pointer border-2 border-neutral-200 rounded-2xl p-4 flex items-center gap-3 hover:border-black transition-all bg-white font-bold text-sm">
            <input type="radio" name="payment_method" value="cod" checked class="accent-black w-4 h-4">
            Cash on Delivery (COD)
          </label>
          <label class="cursor-pointer border-2 border-neutral-200 rounded-2xl p-4 flex items-center gap-3 hover:border-black transition-all bg-white font-bold text-sm">
            <input type="radio" name="payment_method" value="paystation" class="accent-black w-4 h-4">
            Paystation Gateway (Online)
          </label>
        </div>

        <!-- COD Inputs (data-show-if) -->
        <div data-show-if="payment_method:cod" class="space-y-4 pt-2">
          <input type="text" name="cust_name" placeholder="Full Name *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="tel" name="cust_phone" placeholder="Phone Number *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
            <input type="email" name="cust_email" placeholder="Email Address *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
          </div>
          <textarea name="cust_address" rows="2" placeholder="Delivery Address *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium resize-none"></textarea>
        </div>

        <!-- Paystation Inputs (data-show-if) -->
        <div data-show-if="payment_method:paystation" class="space-y-4 pt-2 hidden">
          <input type="text" name="cust_name" placeholder="Full Name *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="tel" name="cust_phone" placeholder="Phone Number *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
            <input type="email" name="cust_email" placeholder="Email Address *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium">
          </div>
          <textarea name="cust_address" rows="2" placeholder="Billing Address *" required class="w-full border border-neutral-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black font-medium resize-none"></textarea>
        </div>

      </my-checkout>

    </section>
  </main>

  <my-footer>
    <div slot="description">
      <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-2">Rawgad</h3>
      <p class="text-xs text-neutral-400 leading-relaxed">Engineered with Web Components and Tailwind CSS. No bloat, just speed.</p>
    </div>
    <div slot="social" class="flex flex-col gap-2 text-xs">
      <a href="https://twitter.com" target="_blank" class="text-neutral-400 hover:text-white transition-colors">X (Twitter)</a>
      <a href="https://instagram.com" target="_blank" class="text-neutral-400 hover:text-white transition-colors">Instagram</a>
      <a href="https://youtube.com" target="_blank" class="text-neutral-400 hover:text-white transition-colors">YouTube</a>
    </div>
    <div slot="extra">
      <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-4">Newsletter</h3>
      <my-form api-endpoint="https://jsonplaceholder.typicode.com/posts" button-text="Subscribe">
        <input type="email" name="email" placeholder="Enter your email..." required class="border border-neutral-800 bg-neutral-900 text-white px-4 py-2.5 rounded-xl text-xs focus:outline-none focus:border-white w-full mb-2">
      </my-form>
    </div>
  </my-footer>
</body>
</html>
